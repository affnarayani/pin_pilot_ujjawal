name: Post Pinterest Pin

on:
  workflow_dispatch: # GitHub UI par 'Run workflow' button se ise manually chalane ke liye

permissions:
  contents: write # GitHub Runner ko agar repository me koi badlav ya log save karna ho toh uski permission

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository se latest code ko pull karna
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }} # PAT_TOKEN ho toh best, nahi toh default token

      # 2. Python environment setup karna
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Baar-baar download se bachne ke liye caching

      # 3. requirements.txt file se saare packages install karna
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Playwright Chromium install karna (System dependencies ke sath taaki Linux par crash na ho)
      - name: Install Playwright and System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      # 5. Pinterest Pin Automation script run karna (Zaroori Secrets ke sath)
      - name: Run Pinterest Pin Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python post_pin.py

      # 6. Agar script run hone ke baad repository me koi change ya log file banti hai toh use push karna
      - name: Commit and Push Any Changes (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Conflict se bachne ke liye latest code pull karna
          git pull origin main
          
          # Agar koi badlav hua hai toh use stage karna (Jaise koi local log ya temporary file)
          git add .
          
          # Check karna ki kuch commit karne layak hai ya nahi
          if git diff --staged --quiet; then
            echo "No new changes or logs to commit."
          else
            git commit -m "chore: automated pinterest pin execution update [skip ci]"
            git push origin main
          fi