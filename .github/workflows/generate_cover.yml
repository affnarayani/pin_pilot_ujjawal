name: Generate Ebook Cover

on:
  workflow_dispatch: # इससे आप GitHub UI पर जाकर 'Run workflow' बटन से इसे मैन्युअली चला सकते हैं

permissions:
  contents: write # गिटहब रनर को कोड और इमेज वापस पुश करने की परमिशन देता है

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # 1. सबसे पहले लेटेस्ट कोड को पुल (Fetch) करना
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }} # अगर PAT_TOKEN उपलब्ध है तो उसे यूज़ करेगा, नहीं तो डिफ़ॉल्ट टोकन

      # 2. पाइथन सेटअप करना
      - name: Set up Python
        uses: actions/setup-python@v6 # (या डिफ़ॉल्ट setup-python@v5)
        with:
          python-version: '3.10'
          cache: 'pip' # बार-बार डाउनलोड से बचने के लिए कैशिंग

      # 3. requirements.txt फ़ाइल इंस्टॉल करना
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Playwright के सिस्टम डिपेंडेंसी और Chromium ब्राउज़र को इंस्टॉल करना
      - name: Install Playwright Browsers & Deps
        run: |
          playwright install chromium --with-deps

      # 5. आपकी मेन स्क्रिप्ट रन करना (Secrets पास करने के साथ)
      - name: Run Cover Generation Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          python generate_cover.py

      # 6. जेनरेट हुई इमेज को रिपॉजिटरी में कमिट और पुश करना (Persistence मेंटेन करने के लिए)
      - name: Commit and Push Generated Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # रिपॉजिटरी को दोबारा पुल करना ताकि अगर इस बीच कोई और बदलाव हुआ हो तो कनफ्लिक्ट न हो
          git pull origin main
          
          # सिर्फ नई जेनरेट हुई .png इमेजेस को ट्रैक करना
          git add highres_cat_*.png
          
          # चेक करना कि कोई नई इमेज बनी भी है या नहीं (ताकि खाली कमिट होकर एरर न आए)
          if git diff --staged --quiet; then
            echo "No new image generated or saved."
          else
            git commit -m "chore: add newly generated ebook cover image [skip ci]"
            git push origin main
          fi