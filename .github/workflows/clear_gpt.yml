name: Delete ChatGPT

on:
  schedule:
    # Triggers the workflow daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Playwright & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium

      - name: Run Chat History Deletion Script (with Xvfb Virtual Screen)
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          # Bina code badle crash hone par automatic screenshot lene ke liye
          PLAYWRIGHT_SCREENSHOT_ON_FAILURE: 'on'
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python clear_gpt.py

      # Agar script kisi wajah se fail hoti hai, toh screenshot download karke dekh sakte hain
      - name: Upload Debug Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: |
            ./**/*.png
            ./screenshot.png
          if-no-files-found: ignore