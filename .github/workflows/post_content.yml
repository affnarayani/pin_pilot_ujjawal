name: Generate Cover and Post Pinterest Pin

on:
  workflow_dispatch: # GitHub UI पर 'Run workflow' बटन से इसे मैन्युअली चलाने के लिए

permissions:
  contents: write # गिटहब रनर को कोड, लॉग्स बदलने और इमेजेस को मैनेज करने की परमिशन देता है

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # 1. रिपॉजिटरी से लेटेस्ट कोड को पुल (Fetch) करना
      # नोट: यहाँ actions/checkout@v4 का उपयोग किया गया है जो पूरी तरह स्टेबल है
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }} # अगर PAT_TOKEN उपलब्ध है तो उसे यूज़ करेगा, नहीं तो डिफ़ॉल्ट टोकन

      # 2. पाइथन एनवायरनमेंट सेटअप करना
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # बार-बार डाउनलोड से बचने के लिए कैशिंग

      # 3. requirements.txt फ़ाइल से सारे पैकेजेस इंस्टॉल करना
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Playwright Chromium और उसके सिस्टम डिपेंडेंसीज इंस्टॉल करना (ताकि Linux रनर पर ब्राउज़र क्रैश न हो)
      - name: Install Playwright and System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      # 5. स्टेप १: कवर इमेज जेनरेट करने वाली स्क्रिप्ट रन करना
      - name: Run Cover Generation Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python generate_cover.py

      # 6. स्टेप २: पिन ऑटोमेशन स्क्रिप्ट रन करना (जो इमेज पोस्ट करने के बाद clear_image_folder() चलाएगी)
      - name: Run Pinterest Pin Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python post_pin.py

      # 7. गिटहब रिपॉजिटरी में हुए बदलावों (जैसे डिलीट हुई इमेजेस या नए लॉग्स) को सिंक और पुश करना
      - name: Commit and Push Any Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # किसी भी कनफ्लिक्ट से बचने के लिए रिपॉजिटरी को दोबारा पुल करना
          git pull origin main
          
          # '-A' या '--all' का उपयोग करने से स्क्रिप्ट द्वारा डिलीट की गई फाइलें (Cleanup) 
          # और अगर कोई नई लॉग फ़ाइल बनी है, दोनों गिट में सही से ट्रैक हो जाती हैं।
          git add -A
          
          # चेक करना कि क्या कोई फाइल कमिट करने के लिए बची है (ताकि खाली कमिट एरर न आए)
          if git diff --staged --quiet; then
            echo "No new changes or deleted images to commit."
          else
            git commit -m "chore: automated cover generation, pinterest pin posting, and cleanup [skip ci]"
            git push origin main
          fi