name: 1A. Post Generate

on:
  schedule:
    - cron: '51 21 * * *'
    - cron: '35 3 * * *'
    - cron: '4 17 * * *'
    - cron: '18 22 * * *'
    - cron: '30 2 * * *'
    - cron: '6 8 * * *'
  workflow_dispatch:

concurrency:
  group: repository-lock
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN_ALL }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11' # Optimal version for dependencies

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Set up repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        
        # 2. Install Cloudflare WARP
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        
        # 3. Start service
        sudo systemctl start warp-svc
        sleep 2
        
        # 4. Register client
        warp-cli --accept-tos registration new || warp-cli registration new
        
        # 5. Set mode to WARP (full tunnel)
        # Route all runner traffic through WARP
        warp-cli --accept-tos mode warp || warp-cli mode warp
        
        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5
        
        # 7. Verify network trace
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python post_generate.py

    - name: Upload Error Screenshot
      if: failure() # Run only when previous step fails
      uses: actions/upload-artifact@v4
      with:
        name: playwright-error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore

    - name: Commit and Push Changes (If updated)
      run: |
        # Track pipeline, state, and config files
        git add -A
        
        if git diff --staged --quiet; then
          echo "[INFO] No changes detected (Content might have been already posted or execution skipped). Skipping push."
        else
          echo "[OK] Changes detected. Committing and pushing updates..."
          git commit -m "Automated: Update article and topics list [skip ci]"
          git pull origin ${GITHUB_REF_NAME} --rebase
          git push origin ${GITHUB_REF_NAME}
        fi