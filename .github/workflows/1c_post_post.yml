name: 1C. Post Post

on: 
  workflow_dispatch: 
  workflow_run:
    workflows: ["1B. Post Image Generate"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  run-script:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      # 1. Repository ka code checkout karna
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN_ALL }}

      # 2. Python Environment setup karna
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Git configuration setup karna
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Latest changes pull karna conflicts se bachne ke liye
      - name: Pull Latest Changes (Maintain Persistence)
        run: |
          git pull origin HEAD --rebase

      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Set up repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # 2. Install Cloudflare WARP
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          
          # 3. Start service
          sudo systemctl start warp-svc
          sleep 2
          
          # 4. Register client
          warp-cli --accept-tos registration new || warp-cli registration new
          
          # 5. Set mode to WARP (full tunnel)
          # Route all runner traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp
          
          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5
          
          # 7. Verify network trace
          curl https://cloudflare.com/cdn-cgi/trace

      # 5. Required Python Packages/Dependencies install karna (No HF)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 6. Playwright ke Chromium browser aur uski system dependencies install karna
      - name: Install Playwright Chromium and system dependencies
        run: |
          playwright install chromium --with-deps

      # 7. Post Pin Script ko run karna aur Environment Secret paas karna
      - name: Execute Automation Script
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_JSON_STR: ${{ secrets.TOKEN_JSON_STR }}
          IMGBBB_API_KEY: ${{ secrets.IMGBBB_API_KEY }}
        run: |
          python post_post.py

      # 8. Agar script fail hoti hai, toh error_screenshot.png ko upload karna
      - name: Upload Error Screenshot if script fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-post-error
          path: error/error_screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      # 9. Agar script successful ho, to state tracker file ko commit aur push karna
      - name: Commit and Push updated pipeline states
        if: success()
        run: |
          # Script updates pipeline state in json/pinterest_ideas.json
          git add json/pinterest_ideas.json locators/changed_locators.json locators/chatgpt_locators.txt locators/pinterest_locators.txt json/config.json
          
          if git diff --staged --quiet; then
            echo "[INFO] No changes detected in state file. Skipping push."
          else
            echo "[OK] Changes detected. Committing and pushing updates..."
            git commit -m "Automated: Update pipeline states to posted [skip ci]"
            git pull origin ${GITHUB_REF_NAME} --rebase
            git push origin ${GITHUB_REF_NAME}
          fi